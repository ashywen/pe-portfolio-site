{# String-art curve used as a corner decoration. #}
{% macro string_art(cls) %}
<svg class="string-art {{ cls }}" viewBox="0 0 300 300" aria-hidden="true" focusable="false">
    {% for i in range(0, 31) %}
        <line x1="0" y1="{{ i * 10 }}" x2="{{ i * 10 }}" y2="300" />
    {% endfor %}
</svg>
{% endmacro %}
