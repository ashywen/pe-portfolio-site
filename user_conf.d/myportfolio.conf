map $request_method $limit_key {
    OPTIONS "";
    default $binary_remote_addr;
}

limit_req_zone $limit_key zone=timeline_post_limit_by_method:10m rate=1r/m;

server {
    listen 80;
    server_name ashleydeng.duckdns.org;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ashleydeng.duckdns.org;

    location / {
        proxy_pass http://myportfolio:5000/;
    }

    location = /api/timeline_post {
        # limit_req zone=timeline_post_limit_by_method nodelay;
        # limit_req_status 429;
        # error_page 429 = @rate_limited;
        proxy_pass http://myportfolio:5000/api/timeline_post;
    }

    location @rate_limited {
        default_type application/json;
        return 429 '{"error": "Rate limit exceeded. Please wait a minute before posting again."}';
    }

    #Load the certificate and key files
    ssl_certificate /etc/letsencrypt/live/ashleydeng.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ashleydeng.duckdns.org/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/ashleydeng.duckdns.org/chain.pem;
}